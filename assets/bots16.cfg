// Larger-map 16v16 match with the measured human combat profile.
set sv_maxclients 40
set g_doWarmup 0
set g_botCombatTuning 1
set g_botHumanAimCone 6
set g_botHumanReaction 600
set g_botHumanTurnSpeed 160
set g_botHumanFireDelay 300
set g_botTeamwork 1
set g_botSpawnScale 1
set g_botNavTuning 1
set g_botNavNodes 8192
map arachnid2
bot fill humans 16 bell
bot fill aliens 16 bell
